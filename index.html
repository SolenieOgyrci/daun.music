<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>daun.music</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: white;
            padding: 20px;
            position: relative;
        }
        /* Огненные рамки по бокам */
        body::before, body::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 10px;
            background: linear-gradient(to bottom, #ff4500, #ff8c00, #ffd700);
            box-shadow: 0 0 15px #ff4500;
        }
        body::before { left: 0; }
        body::after { right: 0; }

        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        header {
            text-align: center;
            padding: 30px 0;
        }
        h1 {
            color: #1DB954;
            font-size: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .logo {
            width: 60px;
            height: 60px;
        }
        .player {
            background: #181818;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        #track-info h2 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        #track-info p {
            color: #aaa;
        }
        
        /* Скрываем дефолтный плеер */
        audio {
            display: none;
        }
        
        /* Кастомный прогресс-бар */
        .custom-progress {
            width: 100%;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .progress-fill {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0%;
            background: linear-gradient(90deg, #1DB954, #1aa34a);
            border-radius: 20px;
            opacity: 0.3;
            transition: width 0.1s linear;
            pointer-events: none;
        }
        
        .progress-text {
            position: relative;
            z-index: 2;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        button {
            background: #1DB954;
            border: none;
            color: white;
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        button:hover {
            background: #1aa34a;
            transform: translateY(-2px);
        }
        .playlist {
            list-style: none;
        }
        .playlist li {
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .playlist li:hover {
            background: rgba(255,255,255,0.05);
        }
        .playlist li.active {
            background: rgba(29,185,84,0.2);
            border-left: 4px solid #1DB954;
        }
        .track-info {
            display: flex;
            flex-direction: column;
        }
        .track-title {
            font-weight: bold;
            color: white;
        }
        .track-artist {
            font-size: 0.9rem;
            color: #aaa;
        }
        .track-duration {
            color: #1DB954;
            font-size: 0.9rem;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #aaa;
            font-size: 0.9rem;
        }
        .error-message {
            color: #ff6b6b;
            text-align: center;
            padding: 10px;
            background: rgba(255,0,0,0.1);
            border-radius: 10px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>
                <img src="https://trollfacepng.com/wp-content/uploads/2025/04/st_small_507x507-pad_600x600_f8f8f8__35_-removebg-preview.png"
                     alt="Trollface Logo" class="logo">
                daun.music
            </h1>
            <p>BEST MUSIC EVER</p>
        </header>

        <div class="player">
            <div id="track-info">
                <h2 id="track-title">Выберите трек</h2>
                <p id="track-artist">Исполнитель</p>
            </div>

            <audio id="audio-player"></audio>
            
            <!-- Кастомный прогресс-бар -->
            <div class="custom-progress" id="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
                <span class="progress-text" id="progress-text">0:00 / 0:00</span>
            </div>

            <div class="controls">
                <button id="prev-btn"> PAST BRADAR</button>
                <button id="play-pause-btn"> PLAY BRADAR</button>
                <button id="next-btn"> NEXT BRADAR</button>
            </div>
            
            <div id="error-message" class="error-message" style="display: none;"></div>
        </div>

        <h2>🔥 COOL MUSICA PLAYLIST TROLLFACE</h2>
        <ul class="playlist" id="playlist">
            <!-- Треки будут добавляться здесь -->
        </ul>

        <footer>
            <p>daun.music © 2026 | BEST MUSIC</p>
        </footer>
    </div>

    <script>
        const audioPlayer = document.getElementById('audio-player');
        const trackTitle = document.getElementById('track-title');
        const trackArtist = document.getElementById('track-artist');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const playlist = document.getElementById('playlist');
        const errorMessage = document.getElementById('error-message');
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');

        // Список треков (пути к твоим файлам)
        const tracks = [
            {
                title: "ULTRAMATUSHKA PIZDEC TROLLFACE",
                artist: "MOYA MAMOCHKA",
                src: "music/track1.mp3"
            },
            {
                title: "SKIBIDI SIGMA TROLLFACE WATAHELL OMG",
                artist: "PIDOR",
                src: "music/track2.mp3"
            },
            {
                title: "PISUN TROLLFACE MANGO",
                artist: "AHUET PIZDEC CITY BOY",
                src: "music/track3.mp3"
            }
             {
                title: "BRAINROT TUFFFFFF FONK FUNK PHONK",
                artist: "SISKA TIMOFEYA CHERNOUSKO",
                src: "music/track4.mp3"
            },
            {
                title: "AAAAAAAH BRAZILIA OHH FUCK PORNO",
                artist: "SOSOK MATVEYA CHENOUSKO feat. SISKA TIMOFEYA CHERNOUSKO",
                src: "music/track5.mp3"
            },
            {
                title: "LOS TRALELETOS PIZDEC KAK KRUTO",
                artist: "SIN HUYNI PIDOR AHUEVSHI",
                src: "music/track6.mp3"
            }
        ];

        let currentTrackIndex = 0;

        // Форматирование времени
        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Обновление прогресс-бара
        function updateProgress() {
            if (audioPlayer.duration) {
                const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                progressFill.style.width = percent + '%';
                progressText.textContent = `${formatTime(audioPlayer.currentTime)} / ${formatTime(audioPlayer.duration)}`;
            }
        }

        // Перемотка по клику на прогресс-бар
        function seek(e) {
            const rect = progressBar.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percent = clickX / rect.width;
            audioPlayer.currentTime = percent * audioPlayer.duration;
        }

        // Функция для отображения ошибок
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 3000);
        }

        // Функция для загрузки трека
        function loadTrack(index) {
            if (index < 0) index = tracks.length - 1;
            if (index >= tracks.length) index = 0;
            
            const track = tracks[index];
            currentTrackIndex = index;

            trackTitle.textContent = track.title;
            trackArtist.textContent = track.artist;
            
            // Пробуем загрузить файл
            audioPlayer.src = track.src;
            audioPlayer.load();
            
            // Проверяем, загрузился ли файл
            audioPlayer.onerror = function() {
                showError(`Не могу найти файл: ${track.src}`);
                trackTitle.textContent = "⚠️ Файл не найден";
            };
            
            // Сбрасываем прогресс-бар
            progressFill.style.width = '0%';
            progressText.textContent = '0:00 / 0:00';
            
            // Обновляем активный трек в плейлисте
            updatePlaylistActive();
        }

        // Функция для обновления активного трека в плейлисте
        function updatePlaylistActive() {
            document.querySelectorAll('.playlist li').forEach((li, index) => {
                if (index === currentTrackIndex) {
                    li.classList.add('active');
                } else {
                    li.classList.remove('active');
                }
            });
        }

        // Функция для воспроизведения/паузы
        function togglePlay() {
            if (audioPlayer.paused) {
                audioPlayer.play().catch(e => {
                    showError('Не могу воспроизвести. Проверь файлы.');
                });
                playPauseBtn.textContent = '⏸️ STOP BRADAR';
            } else {
                audioPlayer.pause();
                playPauseBtn.textContent = '▶️ PLAY BRADAR';
            }
        }

        // Функция для переключения на следующий трек
        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
            loadTrack(currentTrackIndex);
            audioPlayer.play().catch(e => {});
            playPauseBtn.textContent = '⏸️ STOP BRADAR';
        }

        // Функция для переключения на предыдущий трек
        function prevTrack() {
            currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
            loadTrack(currentTrackIndex);
            audioPlayer.play().catch(e => {});
            playPauseBtn.textContent = '⏸️ STOP BRADAR';
        }

        // Функция для создания плейлиста
        function renderPlaylist() {
            playlist.innerHTML = '';
            
            tracks.forEach((track, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <div class="track-info">
                        <span class="track-title">${track.title}</span>
                        <span class="track-artist">${track.artist}</span>
                    </div>
                    <span class="track-duration">🎵</span>
                `;
                
                li.addEventListener('click', () => {
                    if (currentTrackIndex === index) {
                        togglePlay();
                    } else {
                        loadTrack(index);
                        audioPlayer.play().catch(e => {});
                        playPauseBtn.textContent = '⏸️ STOP BRADAR';
                    }
                });
                
                playlist.appendChild(li);
            });
            
            updatePlaylistActive();
        }

        // Обновляем прогресс
        audioPlayer.addEventListener('timeupdate', updateProgress);
        
        // Обновляем когда трек загружен
        audioPlayer.addEventListener('loadedmetadata', () => {
            progressText.textContent = `0:00 / ${formatTime(audioPlayer.duration)}`;
        });

        // Обновляем кнопку play/pause когда трек заканчивается
        audioPlayer.addEventListener('ended', () => {
            nextTrack();
        });

        // Обновляем кнопку play/pause когда трек на паузе
        audioPlayer.addEventListener('pause', () => {
            playPauseBtn.textContent = '▶️ PLAY BRADAR';
        });

        audioPlayer.addEventListener('play', () => {
            playPauseBtn.textContent = '⏸️ STOP BRADAR';
        });

        // Клик по прогресс-бару для перемотки
        progressBar.addEventListener('click', seek);

        // Вешаем обработчики на кнопки
        playPauseBtn.addEventListener('click', togglePlay);
        nextBtn.addEventListener('click', nextTrack);
        prevBtn.addEventListener('click', prevTrack);

        // Загружаем первый трек при старте
        renderPlaylist();
        loadTrack(0);

        // Добавляем клавиши для удобства
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlay();
            } else if (e.code === 'ArrowRight') {
                nextTrack();
            } else if (e.code === 'ArrowLeft') {
                prevTrack();
            }
        });

        console.log('Плеер готов! Треки:', tracks);
    </script>
</body>
</html>
