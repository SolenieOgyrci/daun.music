<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>daun.music</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: white;
            padding: 20px;
            position: relative;
            transition: background-image 0.3s ease;
            background-image: var(--bg-low-vision, none);
            background-size: cover;
            background-repeat: no-repeat;
            background-blend-mode: overlay;
        }
        /* Крутые рамочки омагад */
        body::before, body::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 10px;
            background: linear-gradient(to bottom, #ff4500, #ff8c00, #ffd700);
            box-shadow: 0 0 15px #ff4500;
        }
        body::before { left: 0; }
        body::after { right: 0; }

        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        header {
            text-align: center;
            padding: 30px 0;
        }
        h1 {
            color: #1DB954;
            font-size: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            position: relative;
        }
        
        /* Контейнер для логотипов */
        .logo-container {
            position: relative;
            width: 60px;
            height: 60px;
            display: inline-block;
        }
        
        .logo {
            width: 60px;
            height: 60px;
            position: relative;
            z-index: 2;
        }
        
        /* Призрачная копия логотипа для 500% громкости - теперь точно на том же месте */
        .logo-ghost {
            position: absolute;
            top: 0;
            left: 0;
            width: 60px;
            height: 60px;
            opacity: 0.5;
            pointer-events: none;
            z-index: 3;
            animation: trollface-shake 0.2s infinite;
            display: var(--show-ghost, none);
        }
        
        /* Специальная анимация как в троллфейс эдитах */
        @keyframes trollface-shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            10% { transform: translate(-2px, -1px) rotate(-1deg); }
            20% { transform: translate(2px, 2px) rotate(1deg); }
            30% { transform: translate(-1px, 2px) rotate(-0.5deg); }
            40% { transform: translate(1px, -2px) rotate(0.5deg); }
            50% { transform: translate(-2px, 1px) rotate(-0.8deg); }
            60% { transform: translate(2px, -1px) rotate(0.8deg); }
            70% { transform: translate(-1px, -2px) rotate(-0.3deg); }
            80% { transform: translate(1px, 2px) rotate(0.3deg); }
            90% { transform: translate(-2px, 1px) rotate(-0.5deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        
        .player {
            background: #181818;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        #track-info h2 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        #track-info p {
            color: #aaa;
        }
        
        /* это шоб дефолт плеер скрыть */
        audio {
            display: none;
        }
        
        /* Кастомный плеер */
        .custom-progress {
            width: 100%;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .progress-fill {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0%;
            background: linear-gradient(90deg, #1DB954, #1aa34a);
            border-radius: 20px;
            opacity: 0.3;
            transition: width 0.1s linear;
            pointer-events: none;
        }
        
        .progress-text {
            position: relative;
            z-index: 2;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        button {
            background: #1DB954;
            border: none;
            color: white;
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button:hover {
            background: #1aa34a;
            transform: translateY(-2px);
        }
        /* Стиль для кнопки скачивания с картинкой */
        .download-btn {
            background: #ff8c00;
            padding: 8px 20px;
        }
        .download-btn:hover {
            background: #e07b00;
        }
        .download-btn img {
            width: 24px;
            height: 24px;
            filter: drop-shadow(0 0 3px rgba(0,0,0,0.5));
        }
        /* тултип при наведении */
        .download-btn {
            position: relative;
        }
        .download-btn:hover::after {
            content: "BRADAR SKACHAT ETO FUCK FUCK PHONK";
            position: absolute;
            bottom: 110%;
            left: 50%;
            transform: translateX(-50%);
            background: #1DB954;
            color: black;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 20px;
            white-space: nowrap;
            font-size: 0.8rem;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            border: 1px solid #fff;
            z-index: 10;
            pointer-events: none;
        }

        /* Кнопка громкости (только иконка) */
        .volume-btn {
            background: #1DB954;
            padding: 12px;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .volume-btn img {
            width: 28px;
            height: 28px;
            filter: brightness(0) invert(1);
        }
        .volume-btn:hover {
            background: #1aa34a;
        }
        .volume-btn.active {
            background: #ff4500;
            box-shadow: 0 0 15px #ff4500;
        }

        /* Контейнер для громкости - появляется по клику */
        .volume-control {
            position: relative;
            display: flex;
            align-items: center;
        }
        .volume-slider-container {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #282828;
            padding: 15px 10px;
            border-radius: 30px;
            border: 1px solid #1DB954;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            margin-bottom: 10px;
            width: 200px;
            z-index: 20;
            display: none;
        }
        .volume-slider-container.visible {
            display: block;
        }
        .volume-slider {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, #1DB954 0%, #ff4500 500%);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            border: 2px solid #1DB954;
            cursor: pointer;
        }
        .volume-value {
            text-align: center;
            margin-top: 8px;
            color: #1DB954;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .playlist {
            list-style: none;
        }
        .playlist li {
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .playlist li:hover {
            background: rgba(255,255,255,0.05);
        }
        .playlist li.active {
            background: rgba(29,185,84,0.2);
            border-left: 4px solid #1DB954;
        }
        .track-info {
            display: flex;
            flex-direction: column;
        }
        .track-title {
            font-weight: bold;
            color: white;
        }
        .track-artist {
            font-size: 0.9rem;
            color: #aaa;
        }
        .track-duration {
            color: #1DB954;
            font-size: 0.9rem;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #aaa;
            font-size: 0.9rem;
        }
        .error-message {
            color: #ff6b6b;
            text-align: center;
            padding: 10px;
            background: rgba(255,0,0,0.1);
            border-radius: 10px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>
                <div class="logo-container">
                    <img src="https://trollfacepng.com/wp-content/uploads/2025/04/st_small_507x507-pad_600x600_f8f8f8__35_-removebg-preview.png"
                         alt="Trollface Logo" class="logo">
                    <!-- Призрачная копия логотипа теперь внутри контейнера и точно на том же месте -->
                    <img src="https://trollfacepng.com/wp-content/uploads/2025/04/st_small_507x507-pad_600x600_f8f8f8__35_-removebg-preview.png"
                         alt="Ghost Logo" class="logo-ghost" id="logo-ghost">
                </div>
                daun.music
            </h1>
            <p>BEST MUSIC EVER</p>
        </header>

        <div class="player">
            <div id="track-info">
                <h2 id="track-title">Выберите трек</h2>
                <p id="track-artist">Исполнитель</p>
            </div>

            <audio id="audio-player"></audio>
            
            <!-- Кастомный прогресс-бар -->
            <div class="custom-progress" id="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
                <span class="progress-text" id="progress-text">0:00 / 0:00</span>
            </div>

            <div class="controls">
                <button id="prev-btn"> PAST BRADAR</button>
                <button id="play-pause-btn"> PLAY BRADAR</button>
                <button id="next-btn"> NEXT BRADAR</button>
                <!-- Кнопка скачивания -->
                <button id="download-btn" class="download-btn">
                    <img src="https://trollfacepng.com/wp-content/uploads/2025/04/3a2deb5fa09db5b24fdb65fe7123a8df-removebg-preview-1.png" 
                         alt="Download">
                    SKACHAT
                </button>
                <!-- Кнопка громкости с ползунком по клику -->
                <div class="volume-control">
                    <button class="volume-btn" id="volume-btn">
                        <img src="https://cdn-icons-png.flaticon.com/512/727/727232.png" alt="Volume">
                    </button>
                    <div class="volume-slider-container" id="volume-slider-container">
                        <input type="range" id="volume-slider" class="volume-slider" min="0" max="5" step="0.01" value="1">
                        <div class="volume-value" id="volume-value">100%</div>
                    </div>
                </div>
            </div>
            
            <div id="error-message" class="error-message" style="display: none;"></div>
        </div>

        <h2>🔥 COOL MUSICA PLAYLIST TROLLFACE</h2>
        <ul class="playlist" id="playlist">
            <!-- треки будут добавляться сюда -->
        </ul>

        <footer>
            <p>daun.music © 2026 | BEST MUSIC</p>
        </footer>
    </div>

    <script>
        const audioPlayer = document.getElementById('audio-player');
        const trackTitle = document.getElementById('track-title');
        const trackArtist = document.getElementById('track-artist');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const playlist = document.getElementById('playlist');
        const errorMessage = document.getElementById('error-message');
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        
        const downloadBtn = document.getElementById('download-btn');
        const volumeBtn = document.getElementById('volume-btn');
        const volumeSlider = document.getElementById('volume-slider');
        const volumeValue = document.getElementById('volume-value');
        const volumeContainer = document.getElementById('volume-slider-container');
        const logoGhost = document.getElementById('logo-ghost');

        // Переменная для отслеживания видимости ползунка громкости
        let isVolumeSliderVisible = false;

        // Список треков 
        const tracks = [
            {
                title: "ULTRAMATUSHKA PIZDEC TROLLFACE",
                artist: "MOYA MAMOCHKA",
                src: "music/track1.mp3"
            },
            {
                title: "SKIBIDI SIGMA TROLLFACE WATAHELL OMG",
                artist: "PIDOR",
                src: "music/track2.mp3"
            },
            {
                title: "PISUN TROLLFACE MANGO",
                artist: "AHUET PIZDEC CITY BOY",
                src: "music/track3.mp3"
            },
            {
                title: "BRAINROT TUFFFFFF FONK FUNK PHONK",
                artist: "SISKA TIMOFEYA CHERNOUSKO",
                src: "music/track4.mp3"
            },
            {
                title: "AAAAAAAH BRAZILIA OHH FUCK PORNO",
                artist: "SOSOK MATVEYA CHENOUSKO feat. SISKA TIMOFEYA CHERNOUSKO",
                src: "music/track5.mp3"
            },
            {
                title: "LOS TRALELETOS PIZDEC KAK KRUTO",
                artist: "SIN HUYNI PIDOR AHUEVSHI",
                src: "music/track6.mp3"
            }
        ];

        let currentTrackIndex = 0;

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updateProgress() {
            if (audioPlayer.duration) {
                const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                progressFill.style.width = percent + '%';
                progressText.textContent = `${formatTime(audioPlayer.currentTime)} / ${formatTime(audioPlayer.duration)}`;
            }
        }

        function seek(e) {
            const rect = progressBar.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percent = clickX / rect.width;
            audioPlayer.currentTime = percent * audioPlayer.duration;
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 3000);
        }

        function loadTrack(index) {
            if (index < 0) index = tracks.length - 1;
            if (index >= tracks.length) index = 0;
            
            const track = tracks[index];
            currentTrackIndex = index;

            trackTitle.textContent = track.title;
            trackArtist.textContent = track.artist;
            
            audioPlayer.src = track.src;
            audioPlayer.load();
            
            audioPlayer.onerror = function() {
                showError(`BRADAR WHERE IS SONG: ${track.src}`);
                trackTitle.textContent = "⚠️ NO SONG BRADAR";
            };
            
            progressFill.style.width = '0%';
            progressText.textContent = '0:00 / 0:00';
            
            updatePlaylistActive();
        }

        function updatePlaylistActive() {
            document.querySelectorAll('.playlist li').forEach((li, index) => {
                if (index === currentTrackIndex) {
                    li.classList.add('active');
                } else {
                    li.classList.remove('active');
                }
            });
        }

        function togglePlay() {
            if (audioPlayer.paused) {
                audioPlayer.play().catch(e => {
                    showError('Не могу воспроизвести. Проверь файлы.');
                });
                playPauseBtn.textContent = '⏸️ STOP BRADAR';
            } else {
                audioPlayer.pause();
                playPauseBtn.textContent = '▶️ PLAY BRADAR';
            }
        }

        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
            loadTrack(currentTrackIndex);
            audioPlayer.play().catch(e => {});
            playPauseBtn.textContent = '⏸️ STOP BRADAR';
        }

        function prevTrack() {
            currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
            loadTrack(currentTrackIndex);
            audioPlayer.play().catch(e => {});
            playPauseBtn.textContent = '⏸️ STOP BRADAR';
        }

        function renderPlaylist() {
            playlist.innerHTML = '';
            
            tracks.forEach((track, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <div class="track-info">
                        <span class="track-title">${track.title}</span>
                        <span class="track-artist">${track.artist}</span>
                    </div>
                    <span class="track-duration">🎵</span>
                `;
                
                li.addEventListener('click', () => {
                    if (currentTrackIndex === index) {
                        togglePlay();
                    } else {
                        loadTrack(index);
                        audioPlayer.play().catch(e => {});
                        playPauseBtn.textContent = '⏸️ STOP BRADAR';
                    }
                });
                
                playlist.appendChild(li);
            });
            
            updatePlaylistActive();
        }

        audioPlayer.addEventListener('timeupdate', updateProgress);
        
        audioPlayer.addEventListener('loadedmetadata', () => {
            progressText.textContent = `0:00 / ${formatTime(audioPlayer.duration)}`;
        });

        audioPlayer.addEventListener('ended', () => {
            nextTrack();
        });

        audioPlayer.addEventListener('pause', () => {
            playPauseBtn.textContent = '▶️ PLAY BRADAR';
        });

        audioPlayer.addEventListener('play', () => {
            playPauseBtn.textContent = '⏸️ STOP BRADAR';
        });

        progressBar.addEventListener('click', seek);

        playPauseBtn.addEventListener('click', togglePlay);
        nextBtn.addEventListener('click', nextTrack);
        prevBtn.addEventListener('click', prevTrack);

        function downloadCurrentTrack() {
            const track = tracks[currentTrackIndex];
            const a = document.createElement('a');
            a.href = track.src;
            a.download = track.src.split('/').pop() || 'track.mp3';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showError(`СКАЧИВАЮ: ${track.title}`);
        }

        downloadBtn.addEventListener('click', downloadCurrentTrack);

        // Функция для переключения видимости ползунка громкости
        function toggleVolumeSlider() {
            isVolumeSliderVisible = !isVolumeSliderVisible;
            if (isVolumeSliderVisible) {
                volumeContainer.classList.add('visible');
                volumeBtn.classList.add('active');
            } else {
                volumeContainer.classList.remove('visible');
                volumeBtn.classList.remove('active');
            }
        }

        // Обработчик клика по кнопке громкости
        volumeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleVolumeSlider();
        });

        // Закрываем ползунок при клике вне его
        document.addEventListener('click', (e) => {
            if (isVolumeSliderVisible && 
                !volumeBtn.contains(e.target) && 
                !volumeContainer.contains(e.target)) {
                toggleVolumeSlider();
            }
        });

        // Функция для обновления эффектов в зависимости от громкости
        function updateVolumeEffects(volumePercent) {
            const body = document.body;
            
            // Эффект для 67% - почти незаметная картинка на фоне
            if (volumePercent >= 66 && volumePercent <= 68) {
                body.style.setProperty('--bg-low-vision', 'url("https://avatars.mds.yandex.net/i?id=8e32ce5f58ecffe4ea4487631e1f52a990b715f0-3937077-images-thumbs&n=13")');
            } else {
                body.style.setProperty('--bg-low-vision', 'none');
            }
            
            // Эффект для 500% - трясущаяся копия логотипа точно поверх оригинального
            if (volumePercent >= 500) {
                logoGhost.style.setProperty('--show-ghost', 'block');
                logoGhost.style.display = 'block';
            } else {
                logoGhost.style.setProperty('--show-ghost', 'none');
                logoGhost.style.display = 'none';
            }
        }

        function updateVolume() {
            const val = parseFloat(volumeSlider.value);
            audioPlayer.volume = Math.min(val, 1);
            const percent = Math.round(val * 100);
            volumeValue.textContent = percent + '%';
            
            const percentForGradient = (val / 5) * 100;
            volumeSlider.style.background = `linear-gradient(90deg, #1DB954 0%, #ff4500 ${percentForGradient}%, #555 ${percentForGradient}%)`;
            
            // Вызываем функцию обновления эффектов
            updateVolumeEffects(percent);
        }

        volumeSlider.addEventListener('input', updateVolume);
        
        volumeSlider.value = 1;
        updateVolume();

        renderPlaylist();
        loadTrack(0);

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlay();
            } else if (e.code === 'ArrowRight') {
                nextTrack();
            } else if (e.code === 'ArrowLeft') {
                prevTrack();
            }
        });

        console.log('Плеер готов! Треки:', tracks);
    </script>
</body>
</html>
