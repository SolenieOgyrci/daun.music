<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>daun.music</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: white;
            padding: 20px;
            position: relative;
        }
        /* Огненные рамки по бокам */
        body::before, body::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 10px;
            background: linear-gradient(to bottom, #ff4500, #ff8c00, #ffd700);
            box-shadow: 0 0 15px #ff4500;
        }
        body::before { left: 0; }
        body::after { right: 0; }

        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        header {
            text-align: center;
            padding: 30px 0;
        }
        h1 {
            color: #1DB954;
            font-size: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .logo {
            width: 60px;
            height: 60px;
        }
        .player {
            background: #181818;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        #track-info h2 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        #track-info p {
            color: #aaa;
        }
        audio {
            display: none; /* Скрываем дефолтный плеер */
        }
        .custom-audio-controls {
            width: 100%;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        button {
            background: #1DB954;
            border: none;
            color: white;
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        button:hover {
            background: #1aa34a;
            transform: translateY(-2px);
        }
        .playlist {
            list-style: none;
        }
        .playlist li {
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: background 0.3s;
        }
        .playlist li:hover {
            background: rgba(255,255,255,0.05);
        }
        .playlist li.active {
            background: rgba(29,185,84,0.2);
            border-left: 4px solid #1DB954;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #aaa;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>
                <img src="https://trollfacepng.com/wp-content/uploads/2025/04/st_small_507x507-pad_600x600_f8f8f8__35_-removebg-preview.png"
                     alt="Trollface Logo" class="logo">
                daun.music
            </h1>
            <p>BEST MUSIC EVER</p>
        </header>

        <div class="player">
            <div id="track-info">
                <h2 id="track-title">Выберите трек</h2>
                <p id="track-artist">Исполнитель</p>
            </div>

            <audio id="audio-player"></audio>
            <!-- Кастомный индикатор прогресса -->
            <div class="custom-audio-controls" id="progress-bar">0:00 / 0:00</div>

            <div class="controls">
                <button id="prev-btn">PAST BRADAR</button>
                <button id="play-pause-btn">STOP BRADAR</button>
                <button id="next-btn">NEXT BRADAR</button>
            </div>
        </div>

        <h2>COOL MUSICA PLAYLIST TROLLFACE</h2>
        <ul class="playlist" id="playlist">
            <!-- Треки будут добавляться здесь -->
        </ul>

        <footer>
            <p>daun.music © 2026 | BEST MUSIC</p>
        </footer>
    </div>

    <script>
        const audioPlayer = document.getElementById('audio-player');
        const trackTitle = document.getElementById('track-title');
        const trackArtist = document.getElementById('track-artist');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const playlist = document.getElementById('playlist');
        const progressBar = document.getElementById('progress-bar');

        // Список треков (замените на свои файлы)
        const tracks = [
            {
                title: "ULTRAMATUSHKA PIZDEC TROLLFACE",
                artist: "MOYA MAMOCHKA",
                src: "music/track1.mp3"
            },
            {
                title: "SKIBIDI SIGMA TROLLFACE WATAHELL OMG",
                artist: "PIDOR",
                src: "music/track2.mp3"
            },
            {
                title: "PISUN TROLLFACE MANGO",
                artist: "AHUET PIZDEC CITY BOY",
                src: "music/track3.mp3"
            }
        ];

        let currentTrackIndex = 0;

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updateProgressBar() {
            if (!isNaN(audioPlayer.duration)) {
                const current = formatTime(audioPlayer.currentTime);
                const total = formatTime(audioPlayer.duration);
                progressBar.textContent = `${current} / ${total}`;
            }
        }

        function loadTrack(index) {
            const track = tracks[index];
            currentTrackIndex = index;

            trackTitle.textContent = track.title;
            trackArtist.textContent = track.artist;
            audioPlayer.src = track.src;
            audioPlayer.play();

            // Обновляем выделение в плейлисте
            document.querySelectorAll('.playlist li').forEach((li, i) => {
                li.classList.toggle('active', i === index);
            });

            playPauseBtn.textContent = 'STOP BRADAR';
